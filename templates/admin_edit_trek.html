{% extends "layout.html" %}

{% block content %}

<h2>Edit Trek</h2>

<form method="POST">

    <label>Trek Name</label><input type="text" name="trek_name" value="{{ trek.trek_name }}" required>

    <label>Location</label><input type="text" name="location" value="{{ trek.location }}" required>

    <label>Difficulty</label>

    <select name="difficulty">

        <option value="Easy" {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

        <option value="Moderate" {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

        <option value="Hard" {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

    </select>

    <label>Duration</label><input type="number" name="duration" value="{{ trek.duration }}" required>

    <label>Available Slots</label><input type="number" name="available_slots" value="{{ trek.available_slots }}"
        required>

    <label>Status</label>

    <select name="status">

        <option value="Pending" {% if trek.status=="Pending" %}selected{% endif %}>Pending</option>

        <option value="Approved" {% if trek.status=="Approved" %}selected{% endif %}>Approved</option>

        <option value="Open" {% if trek.status=="Open" %}selected{% endif %}>Open</option>

        <option value="Closed" {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

        <option value="Completed" {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>

    </select>

    <label>Start Date</label><input type="date" name="start_date" value="{{ trek.start_date }}" required>

    <label>End Date</label><input type="date" name="end_date" value="{{ trek.end_date }}" required>

    <button type="submit">Update Trek</button>

</form>

{% endblock %}
