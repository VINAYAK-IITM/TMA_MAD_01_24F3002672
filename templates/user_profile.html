{% extends "layout.html" %}

{% block content %}

<h2>Edit Profile</h2>

<form method="POST">

    <label>Name</label><input type="text" name="name" value="{{ user.name }}" required>

    <label>Email</label><input type="email" name="email" value="{{ user.email }}" required>

    <label>Contact</label><input type="text" name="contact" value="{{ user.contact }}" required>

    <label>Password</label><input type="password" name="password" value="{{ user.password }}" required>

    <br><br>

    <button type="submit">Update Profile</button>

</form>

{% if message %}

<p>{{ message }}</p>

{% endif %}

{% endblock %}
